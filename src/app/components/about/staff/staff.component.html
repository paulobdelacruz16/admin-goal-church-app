<section class="about-staff" aria-labelledby="staff-title">
  <div class="staff-heading">
    <h2 id="staff-title">Meet our team</h2>
  </div>

  <section
    class="staff-category"
    *ngFor="let category of staffCategories"
    [ngClass]="{
      'senior-pastor-category': category.title === 'Senior Pastor',
      'pastoral-staff-category': category.title === 'Pastoral Staff',
      'ministry-heads-category': category.title === 'Ministry Heads',
      'p12-men-category': category.title === 'P12 Men',
      'p12-women-category': category.title === 'P12 Women'
    }"
    [attr.aria-labelledby]="category.title | lowercase"
  >
    <div class="staff-heading category-heading">
      <p class="eyebrow" [id]="category.title | lowercase">
        {{ category.title }} <span class="category-count">{{ category.members.length }}</span>
      </p>
    </div>

    <div class="staff-grid" *ngIf="category.members.length; else emptyCategory">
      <article class="staff-member" *ngFor="let member of category.members">
        <img [src]="member.image" [alt]="member.name" loading="lazy" />
        <h3>{{ member.name }}</h3>
        <p>{{ member.role }}</p>
      </article>
    </div>

    <ng-template #emptyCategory>
      <p class="empty-category">Team members will be added here soon.</p>
    </ng-template>
  </section>
</section>
