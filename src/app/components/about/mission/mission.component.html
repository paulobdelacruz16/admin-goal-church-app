<section class="about-mission" aria-labelledby="mission-title">
  <div class="mission-copy">
    <p class="eyebrow">Our Mission</p>
    <h2 id="mission-title">Every heart. Every home.<br />Alive in Christ.</h2>
    <div class="mission-rule"></div>
    <p *ngFor="let paragraph of paragraphs">{{ paragraph }}</p>
  </div>

  <div class="mission-media">
    <iframe
      src="https://www.youtube.com/embed/kD2GvIsp8zQ"
      title="New Hope Hawaii Kai welcome video"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>
</section>
