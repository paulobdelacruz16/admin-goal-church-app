<section class="about-mission" aria-labelledby="mission-title">
  <div class="mission-copy">
    <p class="eyebrow">{{goalContent?.topdescription}}</p>
    <h2 id="mission-title">{{ goalContent?.title }}</h2>
    <div class="mission-rule"></div>
    <p style="white-space: pre-line;">{{ goalContent?.maindescription }}</p>
  </div>

  <div class="mission-media">
    <iframe
      [src]="safeUrl"
      title="New Hope Hawaii Kai welcome video"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>
</section>
